<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3157a4"><link rel="manifest" href="/manifest.webmanifest"><title>智能提醒</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 18px;color:#202938;background:#f5f7fb}h1{text-align:center}.panel{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 20px #172b4d12;margin:18px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #ccd3df}input{width:100%;margin:7px 0 12px}button{background:#3157a4;color:white;border:0;cursor:pointer;margin:4px 0}.item{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#667085;font-size:14px}
</style></head><body><h1>智能提醒</h1><section class="panel" id="login"><h2>登入</h2><input id="password" type="password" placeholder="登入密碼"><button onclick="login()">登入</button><p id="msg" class="muted"></p></section>
<section class="panel" id="app" hidden><h2>新增提醒</h2><input id="title" placeholder="提醒內容"><label>日期及時間</label><input id="due" type="datetime-local"><button onclick="add()">加入提醒</button> <button onclick="enablePush()">開啟推送通知</button><h2>已排定提醒</h2><div id="items"></div></section>
<script>
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失敗');return d}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:password.value})});document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}catch(e){msg.textContent=e.message}}
async function load(){try{const a=await api('/api/reminders');items.innerHTML=a.map(x=>'<div class="item"><b>'+escapeHtml(x.title)+'</b><br><span class="muted">'+new Date(x.due_at).toLocaleString()+'</span> '+(x.sent?'（已發送）':'')+' <button onclick="removeItem('+x.id+')">刪除</button></div>').join('')||'暫時沒有提醒'}catch(e){msg.textContent=e.message}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function add(){try{await api('/api/reminders',{method:'POST',body:JSON.stringify({title:title.value,dueAt:due.value})});title.value='';due.value='';load()}catch(e){alert(e.message)}}
async function removeItem(id){await api('/api/reminders/'+id,{method:'DELETE'});load()}
async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('此瀏覽器不支援推送通知');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('尚未允許通知');const cfg=await api('/api/config');if(!cfg.vapidPublicKey)throw Error('伺服器尚未設定 VAPID 金鑰');const reg=await navigator.serviceWorker.register('/sw.js');const key=Uint8Array.from(atob(cfg.vapidPublicKey.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});await api('/api/subscribe',{method:'POST',body:JSON.stringify(sub)});alert('已開啟推送通知')}catch(e){alert(e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
